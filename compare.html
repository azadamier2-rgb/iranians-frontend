<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقایسه محصولات | خانه‌برق</title><link rel="stylesheet" href="assets/css/ds.css">  <link rel="stylesheet" href="assets/css/colorful-theme.css">
<link rel="stylesheet" href="assets/css/polish.css">
</head><body data-page="compare"><main class="ds-container" style="padding:40px 20px"><h1>مقایسه محصولات</h1><p id="msg" style="color:var(--muted)"></p><div id="compareBox" style="overflow:auto"></div></main><script src="assets/js/config.js"></script><script src="assets/js/storage.js"></script><script src="assets/js/products.js"></script><script src="assets/js/main.js"></script><script>const K='homeshop_compare_v1';async function go(){let ids=[];try{ids=JSON.parse(localStorage.getItem(K)||'[]')}catch{};ids=Array.isArray(ids)?ids.slice(0,4):[];if(!ids.length){msg.textContent='هنوز محصولی برای مقایسه انتخاب نشده است.';return;}const ps=(await Promise.all(ids.map(id=>ProductsAPI.get(id).then(x=>x.product).catch(()=>null)))).filter(Boolean);if(!ps.length){msg.textContent='محصولات قابل مقایسه یافت نشدند.';return;}const keys=['برند','مدل','کد کالا','گارانتی','دسته‌بندی','قیمت','موجودی'];let h='<table style="min-width:700px;width:100%;border-collapse:collapse"><thead><tr><th>ویژگی</th>'+ps.map(p=>'<th style="padding:12px">'+escapeHTML(p.name)+'</th>').join('')+'</tr></thead><tbody>';for(const k of keys){h+='<tr><td style="padding:12px;font-weight:800">'+k+'</td>'+ps.map(p=>'<td style="padding:12px">'+escapeHTML(String(k==='برند'?p.brand:k==='مدل'?p.model:k==='کد کالا'?p.sku:k==='گارانتی'?p.warranty:k==='دسته‌بندی'?p.category:k==='قیمت'?fmt(p.price):p.stock))+'</td>').join('')+'</tr>'}const specKeys=[...new Set(ps.flatMap(p=>Object.keys(p.specifications||{})))];for(const k of specKeys){h+='<tr><td style="padding:12px">'+escapeHTML(k)+'</td>'+ps.map(p=>'<td style="padding:12px">'+escapeHTML(String((p.specifications||{})[k]??'—'))+'</td>').join('')+'</tr>'}h+='</tbody></table>';compareBox.innerHTML=h;}go().catch(e=>msg.textContent=e.message);</script></body></html>
