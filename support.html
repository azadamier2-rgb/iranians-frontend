<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پشتیبانی | خانه‌برق</title><link rel="stylesheet" href="assets/css/ds.css"><link rel="stylesheet" href="assets/css/colorful-theme.css"><link rel="stylesheet" href="assets/css/polish.css">
</head><body><main class="ds-container" style="padding:40px 20px;max-width:900px"><div class="ds-page-hero"><h1>پشتیبانی خانه‌برق 🎧</h1><p>درخواست خود را ثبت کنید؛ پاسخ در حساب کاربری شما نمایش داده می‌شود.</p></div><section class="ds-card" style="padding:22px;margin-top:20px"><form id="f"><input id="name" class="ds-input" placeholder="نام" required><input id="email" type="email" class="ds-input" placeholder="ایمیل" required><input id="phone" class="ds-input" placeholder="شماره تماس"><input id="subject" class="ds-input" placeholder="موضوع" required><textarea id="message" class="ds-textarea" placeholder="متن درخواست" required></textarea><button class="ds-btn ds-btn-primary" type="submit">ثبت تیکت</button><p id="msg"></p></form></section></main><script src="assets/js/config.js"></script><script src="assets/js/storage.js"></script><script src="assets/js/products.js"></script><script>f.addEventListener('submit',async e=>{e.preventDefault();try{await StoreFeaturesAPI.createTicket({name:name.value.trim(),email:email.value.trim(),phone:phone.value.trim(),subject:subject.value.trim(),message:message.value.trim()});msg.textContent='تیکت با موفقیت ثبت شد ✓';e.target.reset();}catch(e){msg.textContent=e.message}})</script></body></html>
