<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود / ثبت‌نام | خانه‌برق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/ds.css">
  <link rel="stylesheet" href="assets/css/colorful-theme.css">
</head>
<body data-page="login">

<main>
  <div class="ds-auth-wrap">
    <div class="ds-auth-box" id="loginBox">
      <h2>ورود به حساب</h2>
      <p class="ds-auth-sub">با ایمیل و رمز عبور خود وارد شوید</p>
      <div class="ds-alert" id="loginErr"></div>
      <div class="ds-form-field">
        <label>ایمیل</label>
        <input type="email" id="loginEmail" class="ds-input" placeholder="example@email.com" autocomplete="username" required>
      </div>
      <div class="ds-form-field">
        <label>رمز عبور</label>
        <input type="password" id="loginPass" class="ds-input" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button class="ds-btn ds-btn-primary ds-btn-full ds-btn-lg" id="loginBtn" type="button">ورود</button>
      <div class="ds-divider"></div>
      <div class="ds-auth-switch">
        حساب ندارید؟ <button id="showRegister" type="button">ثبت‌نام کنید</button>
      </div>
      <div class="ds-auth-switch" style="margin-top:8px">
        <a href="forgot-password.html">رمز عبور را فراموش کرده‌اید؟</a>
      </div>
    </div>

    <div class="ds-auth-box" id="registerBox" style="display:none">
      <h2>ثبت‌نام</h2>
      <p class="ds-auth-sub">یک حساب مشتری ایجاد کنید</p>
      <div class="ds-alert" id="registerErr"></div>
      <div class="ds-alert ds-alert-success" id="registerOk" style="display:none">ثبت‌نام موفق! اکنون وارد شوید.</div>
      <div class="ds-form-field">
        <label>نام</label>
        <input type="text" id="regName" class="ds-input" placeholder="نام و نام خانوادگی" maxlength="80" required>
      </div>
      <div class="ds-form-field">
        <label>ایمیل</label>
        <input type="email" id="regEmail" class="ds-input" placeholder="example@email.com" autocomplete="username" required>
      </div>
      <div class="ds-form-field">
        <label>رمز عبور</label>
        <input type="password" id="regPass" class="ds-input" placeholder="حداقل ۸ کاراکتر" autocomplete="new-password" required>
        <span class="ds-form-hint" id="regPassHint"></span>
      </div>
      <button class="ds-btn ds-btn-primary ds-btn-full ds-btn-lg" id="registerBtn" type="button">ثبت‌نام</button>
      <div class="ds-divider"></div>
      <div class="ds-auth-switch">
        حساب دارید؟ <button id="showLogin" type="button">ورود</button>
      </div>
    </div>
  </div>
</main>

<script src="assets/js/storage.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/auth.js"></script>
<script>
document.getElementById('showRegister').onclick = () => {
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('registerBox').style.display = 'block';
};
document.getElementById('showLogin').onclick = () => {
  document.getElementById('registerBox').style.display = 'none';
  document.getElementById('loginBox').style.display = 'block';
};

document.getElementById('regPass').addEventListener('input', function() {
  const v = this.value, el = document.getElementById('regPassHint');
  if (!v) { el.textContent=''; return; }
  const ok = v.length>=8 && /[a-zA-Z]/.test(v) && /[0-9]/.test(v);
  el.textContent = ok ? '✅ رمز مناسب' : '⚠️ حداقل ۸ کاراکتر، شامل حرف و عدد';
  el.style.color = ok ? 'var(--green)' : 'var(--yellow)';
});
</script>
</body>
</html>
