<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فراموشی رمز | خانه‌برق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/ds.css">
  <link rel="stylesheet" href="assets/css/colorful-theme.css">
<link rel="stylesheet" href="assets/css/polish.css">
</head>
<body data-page="login">
<main>
  <div class="ds-auth-wrap">
    <div class="ds-auth-box">
      <h2>فراموشی رمز عبور</h2>
      <p class="ds-auth-sub">ایمیل خود را وارد کنید. لینک بازیابی برایتان ارسال می‌شود.</p>
      <div class="ds-alert" id="fpErr"></div>
      <div class="ds-alert ds-alert-success" id="fpOk" style="display:none">
        لینک بازیابی به ایمیل شما ارسال شد. لطفاً صندوق دریافت را بررسی کنید.
      </div>
      <div class="ds-form-field">
        <label>ایمیل</label>
        <input type="email" id="fpEmail" class="ds-input" placeholder="example@email.com" autocomplete="email" required>
      </div>
      <button class="ds-btn ds-btn-primary ds-btn-full ds-btn-lg" id="fpBtn">ارسال لینک بازیابی</button>
      <div class="ds-auth-switch ds-mt-16">
        <a href="login.html">← بازگشت به ورود</a>
      </div>
    </div>
  </div>
</main>
<script src="assets/js/config.js"></script><script src="assets/js/ui.js"></script>
<script>
document.getElementById('fpBtn').addEventListener('click', async () => {
  const btn   = document.getElementById('fpBtn');
  const email = document.getElementById('fpEmail').value.trim();
  if (!email) { DS.showAlert(document.getElementById('fpErr'), 'error', 'لطفاً ایمیل را وارد کنید'); return; }
  DS.setLoading(btn, true);
  try {
    await DS.apiFetch('/auth/forgot-password', { method:'POST', body: JSON.stringify({ email }) });
    DS.hideAlert(document.getElementById('fpErr'));
    document.getElementById('fpOk').style.display = 'block';
    document.getElementById('fpEmail').disabled = true;
    btn.disabled = true;
  } catch(e) {
    DS.showAlert(document.getElementById('fpErr'), 'error', e.message);
  } finally {
    DS.setLoading(btn, false);
  }
});
</script>
</body>
</html>
