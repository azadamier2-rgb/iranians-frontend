<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تغییر رمز | خانه‌برق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/ds.css">
  <link rel="stylesheet" href="assets/css/colorful-theme.css">
<link rel="stylesheet" href="assets/css/polish.css">
</head>
<body data-page="login">
<main>
  <div class="ds-auth-wrap">
    <div class="ds-auth-box">
      <h2>رمز عبور جدید</h2>
      <p class="ds-auth-sub">رمز عبور جدید خود را انتخاب کنید</p>
      <div class="ds-alert" id="rpErr"></div>
      <div class="ds-alert ds-alert-success" id="rpOk" style="display:none">
        رمز عبور تغییر کرد! <a href="login.html" style="color:var(--amber)">وارد شوید</a>
      </div>
      <div class="ds-form-field">
        <label>رمز عبور جدید</label>
        <input type="password" id="rpPass" class="ds-input" placeholder="حداقل ۸ کاراکتر" autocomplete="new-password" required>
      </div>
      <div class="ds-form-field">
        <label>تکرار رمز عبور</label>
        <input type="password" id="rpPass2" class="ds-input" placeholder="تکرار رمز جدید" autocomplete="new-password" required>
      </div>
      <button class="ds-btn ds-btn-primary ds-btn-full ds-btn-lg" id="rpBtn">ذخیره رمز جدید</button>
      <div class="ds-auth-switch ds-mt-16">
        <a href="login.html">← بازگشت به ورود</a>
      </div>
    </div>
  </div>
</main>
<script src="assets/js/config.js"></script><script src="assets/js/ui.js"></script>
<script>
document.getElementById('rpBtn').addEventListener('click', async () => {
  const btn   = document.getElementById('rpBtn');
  const pass  = document.getElementById('rpPass').value;
  const pass2 = document.getElementById('rpPass2').value;
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const email = params.get('email');
  if (!email || !token) { DS.showAlert(document.getElementById('rpErr'), 'error', 'لینک بازیابی ناقص یا نامعتبر است'); return; }
  if (pass !== pass2) { DS.showAlert(document.getElementById('rpErr'), 'error', 'رمزها یکسان نیستند'); return; }
  if (pass.length < 8) { DS.showAlert(document.getElementById('rpErr'), 'error', 'رمز باید حداقل ۸ کاراکتر باشد'); return; }
  DS.setLoading(btn, true);
  try {
    await DS.apiFetch('/auth/reset-password', { method:'POST', body: JSON.stringify({ email, token, newPassword: pass }) });
    DS.hideAlert(document.getElementById('rpErr'));
    document.getElementById('rpOk').style.display = 'block';
    btn.disabled = true;
  } catch(e) {
    DS.showAlert(document.getElementById('rpErr'), 'error', e.message);
  } finally {
    DS.setLoading(btn, false);
  }
});
</script>
</body>
</html>
