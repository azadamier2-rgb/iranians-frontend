<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فاکتور | خانه‌برق</title><link rel="stylesheet" href="assets/css/ds.css"><link rel="stylesheet" href="assets/css/colorful-theme.css"><style>@media print{.no-print{display:none!important}body{background:#fff}.ds-card{box-shadow:none!important;border:1px solid #ddd}}</style></head><body><main class="ds-container" style="padding:30px 20px"><div id="invoice" class="ds-card" style="padding:28px;max-width:900px;margin:auto"><p>در حال بارگذاری فاکتور…</p></div></main><script src="assets/js/storage.js"></script><script src="assets/js/products.js"></script><script>
(async()=>{const id=new URLSearchParams(location.search).get('orderId');const box=document.getElementById('invoice');if(!id){box.innerHTML='<p>شناسه سفارش نامعتبر است.</p>';return}try{const {invoice,order}=await StoreFeaturesAPI.invoice(id);document.title=`فاکتور ${invoice.invoiceNumber} | خانه‌برق`;box.innerHTML=`<div style="display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap"><div><h1 style="margin:0">خانه‌برق</h1><p>فاکتور فروش</p></div><div><b>شماره فاکتور:</b> ${escapeHTML(invoice.invoiceNumber)}<br><b>تاریخ:</b> ${new Date(invoice.issuedAt).toLocaleDateString('fa-IR')}</div></div><hr><div style="line-height:2"><b>مشتری:</b> ${escapeHTML(invoice.customerName)}<br><b>تلفن:</b> ${escapeHTML(invoice.customerPhone)}<br><b>آدرس:</b> ${escapeHTML(invoice.customerAddress)}<br>${invoice.postalCode?`<b>کد پستی:</b> ${escapeHTML(invoice.postalCode)}`:''}</div><div style="overflow:auto;margin-top:20px"><table style="width:100%;border-collapse:collapse"><thead><tr><th>محصول</th><th>تعداد</th><th>قیمت واحد</th><th>جمع</th></tr></thead><tbody>${order.items.map(i=>`<tr><td>${escapeHTML(i.product.name)}</td><td>${i.quantity}</td><td>${fmt(i.unitPrice)}</td><td>${fmt(i.unitPrice*i.quantity)}</td></tr>`).join('')}</tbody></table></div><div style="margin-top:20px;max-width:420px;margin-right:auto"><div class="ds-cart-summary-row"><span>جمع کالا</span><b>${fmt(invoice.subtotal)}</b></div><div class="ds-cart-summary-row"><span>تخفیف</span><b>${fmt(invoice.discountAmount)}</b></div><div class="ds-cart-summary-row"><span>هزینه ارسال</span><b>${fmt(invoice.shippingCost)}</b></div><div class="ds-cart-summary-row" style="font-size:18px"><span>مبلغ نهایی</span><b>${fmt(invoice.total)}</b></div></div><button class="ds-btn ds-btn-primary no-print" style="margin-top:25px" onclick="window.print()">🖨️ چاپ فاکتور</button>`}catch(e){box.innerHTML=`<p>${escapeHTML(e.message)}</p>`}})();
</script></body></html>
