<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب کاربری | خانه‌برق</title><link rel="stylesheet" href="assets/css/ds.css">  <link rel="stylesheet" href="assets/css/colorful-theme.css">
</head><body data-page="account"><main class="ds-container" style="padding:40px 20px"><h1>حساب کاربری</h1><section class="ds-card" style="padding:20px;margin:20px 0"><h2>سفارش‌های من</h2><div id="orders"></div></section><section class="ds-card" style="padding:20px;margin:20px 0"><h2>آدرس‌های من</h2><div id="addresses"></div><form id="addressForm"><input id="title" class="ds-input" placeholder="عنوان، مثل خانه" required><input id="recipientName" class="ds-input" placeholder="نام گیرنده" required><input id="recipientPhone" class="ds-input" placeholder="شماره تماس" required><input id="province" class="ds-input" placeholder="استان" required><input id="city" class="ds-input" placeholder="شهر" required><input id="postalCode" class="ds-input" placeholder="کد پستی ۱۰ رقمی" maxlength="10" required><textarea id="address" class="ds-textarea" placeholder="آدرس کامل" required></textarea><label><input id="isDefault" type="checkbox"> آدرس پیش‌فرض</label><button class="ds-btn ds-btn-primary" type="submit">ذخیره آدرس</button></form></section><section class="ds-card" style="padding:20px"><h2>درخواست‌های مرجوعی</h2><div id="returns"></div></section><section class="ds-card" style="padding:20px;margin-top:20px"><h2>پشتیبانی و تیکت‌ها</h2><form id="ticketForm"><input id="ticketSubject" class="ds-input" placeholder="موضوع" required><textarea id="ticketMessage" class="ds-textarea" placeholder="متن درخواست شما" required></textarea><button class="ds-btn ds-btn-primary" type="submit">ثبت تیکت</button></form><div id="tickets" style="margin-top:18px"></div></section></main><script src="assets/js/config.js"></script>`n<script src="assets/js/storage.js"></script><script src="assets/js/products.js"></script><script src="assets/js/main.js"></script><script>const ordersBox=document.getElementById('orders');const addressesBox=document.getElementById('addresses');const returnsBox=document.getElementById('returns');const ticketsBox=document.getElementById('tickets');const addressFormEl=document.getElementById('addressForm');const ticketFormEl=document.getElementById('ticketForm');const titleInput=document.getElementById('title');const recipientNameInput=document.getElementById('recipientName');const recipientPhoneInput=document.getElementById('recipientPhone');const provinceInput=document.getElementById('province');const cityInput=document.getElementById('city');const postalCodeInput=document.getElementById('postalCode');const addressInput=document.getElementById('address');const isDefaultInput=document.getElementById('isDefault');const ticketSubjectInput=document.getElementById('ticketSubject');const ticketMessageInput=document.getElementById('ticketMessage');async function load(){if(!getCurrentUser()){location.href='login.html';return;}const a=await AddressesAPI.list();addressesBox.innerHTML=(a.addresses||[]).map(x=>`<div class="ds-cart-summary-row"><span><b>${escapeHTML(x.title)}</b> — ${escapeHTML(x.province)}، ${escapeHTML(x.city)}، ${escapeHTML(x.address)}</span><button class="ds-btn ds-btn-ghost ds-btn-sm" onclick="delAddr('${x.id}')">حذف</button></div>`).join('')||'<p>هنوز آدرسی ثبت نشده.</p>';const r=await ReturnsAPI.mine();returnsBox.innerHTML=(r.returnRequests||[]).map(x=>`<div class="ds-cart-summary-row"><span>سفارش ${x.order.id.slice(0,8)}…</span><b>${escapeHTML(x.status)}</b></div>`).join('')||'<p>درخواستی ثبت نشده.</p>';const o=await OrdersAPI.listMine();ordersBox.innerHTML=(o.orders||[]).map(x=>`<div class="ds-cart-summary-row"><span>سفارش ${x.id.slice(0,8)}… — ${fmt(x.total)} — ${escapeHTML(x.status)}</span><a class="ds-btn ds-btn-ghost ds-btn-sm" href="invoice.html?orderId=${encodeURIComponent(x.id)}">فاکتور</a></div>`).join('')||'<p>هنوز سفارشی ندارید.</p>';const t=await StoreFeaturesAPI.myTickets();ticketsBox.innerHTML=(t.tickets||[]).map(x=>`<div class="ds-card" style="padding:12px;margin-bottom:8px"><b>${escapeHTML(x.subject)}</b><div>${escapeHTML(x.status)} — ${escapeHTML(x.priority)}</div><p>${escapeHTML(x.message)}</p>${x.adminReply?`<div><b>پاسخ پشتیبانی:</b> ${escapeHTML(x.adminReply)}</div>`:''}</div>`).join('')||'<p>تیکتی ثبت نشده.</p>';}async function delAddr(id){await AddressesAPI.remove(id);load()}ticketFormEl.addEventListener('submit',async e=>{e.preventDefault();try{await StoreFeaturesAPI.createTicket({name:getCurrentUser().name,email:getCurrentUser().email,subject:ticketSubjectInput.value.trim(),message:ticketMessageInput.value.trim()});e.target.reset();load()}catch(e){alert(e.message)}});addressFormEl.addEventListener('submit',async e=>{e.preventDefault();try{await AddressesAPI.create({title:titleInput.value.trim(),recipientName:recipientNameInput.value.trim(),recipientPhone:recipientPhoneInput.value.trim(),province:provinceInput.value.trim(),city:cityInput.value.trim(),postalCode:postalCodeInput.value.replace(/\D/g,''),address:addressInput.value.trim(),isDefault:isDefaultInput.checked});e.target.reset();load()}catch(e){alert(e.message)}});load().catch(e=>alert(e.message));</script></body></html>
